given_name: Ziling
family_name: Wang
chinese_name: 王子凌
affiliation: The University of Hong Kong · TASR Lab
focus: Face privacy · Adversarial machine learning · Responsible AI
biography:
  - >-
    I am a third-year undergraduate at the University of Hong Kong, majoring in Financial Technology, and an undergraduate research assistant at the <a href="https://github.com/HKU-TASR">Trustworthy AI and Systems Research (TASR) Lab</a>, advised by <a href="https://khchow.com">Prof. Ka-Ho Chow</a>.
  - >-
    My research focuses on protecting personal photos from face recognition and image retrieval systems. I work on both privacy protection methods and the tools needed to evaluate them. I am also interested in explainable AI.
