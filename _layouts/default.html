---
layout: compress
---
{% include base_path %}
<!doctype html>
<html lang="{{ site.locale | slice: 0,2 | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include seo.html %}
    <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }} Feed">
    <link rel="stylesheet" href="{{ '/assets/css/research.css' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
    <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon-180x180.png' | relative_url }}">
    <meta name="theme-color" content="#ffffff">
  </head>
  <body class="research-site">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include research-navigation.html %}
    {{ content }}
    {% include research-footer.html %}
    {% include analytics-consent.html %}
    {% include analytics.html %}
    {% if page.mathjax %}<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>{% endif %}
  </body>
</html>
